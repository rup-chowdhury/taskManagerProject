apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels: { app: user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: users
          image: DOCKERHUB_USER/taskboard-user:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: taskboard
            - name: PGUSER
              valueFrom:
                { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: postgres-secret, key: POSTGRES_PASSWORD },
                }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector: { app: user-service }
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
