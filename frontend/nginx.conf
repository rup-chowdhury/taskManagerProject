server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy APIs to cluster services (avoids CORS, single entrypoint)
  location /api/users/ {
    proxy_pass http://tm-user:3001;
  }
  location = /api/users {
    proxy_pass http://tm-user:3001;
  }
  location /api/tasks/ {
    proxy_pass http://tm-task:5000;
  }
  location = /api/tasks {
    proxy_pass http://tm-task:5000;
  }
  location /health {
    return 200 '{"status":"ok","service":"frontend"}';
    add_header Content-Type application/json;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}