spring.application.name=task-service

server.port=5000

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taskboard}
spring.datasource.username=${PGUSER:rup}
spring.datasource.password=${PGPASSWORD:tmpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=10000

user.service.url=${USER_SERVICE_URL:http://localhost:3001}